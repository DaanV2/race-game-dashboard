# This is a basic workflow to help you get started with Actions
name: ⚙️ CI
env:
  FORCE_COLOR: true

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
  merge_group:

jobs:
  proto-checks:
    name: 🗃️ Proto
    uses: ./.github/workflows/proto-checks.yaml
    permissions:
      contents: read
      pull-requests: write

  frontend-checks:
    name: 🌐 Frontend
    uses: ./.github/workflows/frontend-checks.yaml

  wails-checks:
    needs:
      - frontend-checks
    name: 🖥️ Wails Desktop
    uses: ./.github/workflows/wails-checks.yaml
